<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Оплата успешна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(20px);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-label {
            color: #94a3b8;
        }
        
        .info-value {
            font-weight: 600;
            color: white;
        }
        
        .status {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            color: #10b981;
            font-weight: 500;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        
        .timer {
            color: #f59e0b;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .data-list {
            text-align: left;
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
        }
        
        .data-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: monospace;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        
        <h1>Оплата прошла успешно!</h1>
        <p class="subtitle">Спасибо, что выбрали ShadowBoost</p>
        
        <div class="info-box">
            <div id="siteInfo" class="info-row">
                <span class="info-label">Сайт:</span>
                <span class="info-value" id="siteUrlDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Тариф:</span>
                <span class="info-value" id="tariffDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email:</span>
                <span class="info-value" id="emailDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата:</span>
                <span class="info-value" id="dateDisplay">загрузка...</span>
            </div>
        </div>
        
        <div id="statusMessage" class="status">
            ⚙️ Сохраняем задачу...
        </div>
        
        <div id="dataPreview" class="data-list" style="display: none;">
            <div style="color: #6366f1; margin-bottom: 10px;">📋 Сохранённые данные:</div>
            <div id="dataContent"></div>
        </div>
        
        <a href="add-site.html" class="btn">➕ Добавить ещё сайт</a>
        <div class="timer" id="progressTimer"></div>
    </div>

    <script>
        // ===========================================
        // ShadowBoost - СОХРАНЕНИЕ ЗАДАЧ В GITHUB
        // ===========================================
        
        // НАСТРОЙКИ - ТВОИ ДАННЫЕ
        const GITHUB_TOKEN = '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';
        const GITHUB_USER = 'PDDigfhufkrb';
        const GITHUB_REPO = 'trustmetrics';
        
        // Получаем данные из URL и localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id') || 'payment_' + Date.now();
        const fromTariff = urlParams.get('tariff') || 'basic';
        
        // Получаем данные из localStorage
        let siteUrl = localStorage.getItem('last_site_url') || 'не указан';
        let userEmail = localStorage.getItem('shadowboost_email') || 'не указан';
        let userTariff = localStorage.getItem('last_tariff') || fromTariff;
        
        // Определяем название тарифа
        let tariffName = 'Оптима (5 000 ₽)';
        if (userTariff === 'basic') tariffName = 'Базовый (2 000 ₽)';
        if (userTariff === 'pro') tariffName = 'Профи (10 000 ₽)';
        
        // Форматируем дату
        const now = new Date();
        const dateStr = now.toLocaleString('ru-RU');
        
        // Отображаем информацию
        document.getElementById('siteUrlDisplay').textContent = siteUrl;
        document.getElementById('tariffDisplay').textContent = tariffName;
        document.getElementById('emailDisplay').textContent = userEmail;
        document.getElementById('dateDisplay').textContent = dateStr;
        
        // ===========================================
        // ГЛАВНОЕ: СОХРАНЯЕМ В ФАЙЛ НА GITHUB
        // ===========================================
        
        // Формируем данные задачи
        const taskData = {
            id: paymentId,
            date: dateStr,
            timestamp: Date.now(),
            site: siteUrl,
            tariff: userTariff,
            tariff_name: tariffName,
            email: userEmail,
            status: 'new'
        };
        
        console.log('📦 Данные задачи:', taskData);
        
        // Функция для сохранения в GitHub
        async function saveToGitHub() {
            try {
                // Сначала получаем текущий список задач
                const getUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/tasks.json`;
                
                let sha = null;
                let existingTasks = [];
                
                try {
                    const getResponse = await fetch(getUrl, {
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`
                        }
                    });
                    
                    if (getResponse.ok) {
                        const fileData = await getResponse.json();
                        sha = fileData.sha;
                        const content = atob(fileData.content);
                        existingTasks = JSON.parse(content);
                        console.log('📂 Существующие задачи загружены');
                    }
                } catch (e) {
                    console.log('📁 Файла пока нет, создаём новый');
                }
                
                // Добавляем новую задачу
                existingTasks.push(taskData);
                
                // Сохраняем обратно
                const saveResponse = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Новая задача от ${dateStr}`,
                        content: btoa(JSON.stringify(existingTasks, null, 2)),
                        sha: sha
                    })
                });
                
                if (saveResponse.ok) {
                    // Показываем успех
                    document.getElementById('statusMessage').innerHTML = '✅ Задача сохранена в GitHub!';
                    document.getElementById('statusMessage').style.background = 'rgba(16, 185, 129, 0.1)';
                    document.getElementById('statusMessage').style.borderColor = 'rgba(16, 185, 129, 0.3)';
                    document.getElementById('statusMessage').style.color = '#10b981';
                    
                    // Показываем превью данных
                    document.getElementById('dataPreview').style.display = 'block';
                    document.getElementById('dataContent').innerHTML = `
                        <div class="data-item">📌 ID: ${taskData.id}</div>
                        <div class="data-item">🌐 Сайт: ${taskData.site}</div>
                        <div class="data-item">📊 Тариф: ${taskData.tariff_name}</div>
                        <div class="data-item">📧 Email: ${taskData.email}</div>
                        <div class="data-item">🕐 ${taskData.date}</div>
                    `;
                    
                    // Сохраняем в историю браузера
                    let payments = JSON.parse(localStorage.getItem('shadowboost_payments') || '[]');
                    payments.push({
                        id: paymentId,
                        site: siteUrl,
                        tariff: userTariff,
                        date: dateStr,
                        status: 'active'
                    });
                    localStorage.setItem('shadowboost_payments', JSON.stringify(payments));
                    
                } else {
                    throw new Error('Ошибка сохранения');
                }
                
            } catch (error) {
                console.error('❌ Ошибка GitHub:', error);
                
                document.getElementById('statusMessage').innerHTML = '⚠️ Не удалось сохранить в GitHub. Данные сохранены локально.';
                document.getElementById('statusMessage').style.background = 'rgba(245, 158, 11, 0.1)';
                document.getElementById('statusMessage').style.borderColor = 'rgba(245, 158, 11, 0.3)';
                document.getElementById('statusMessage').style.color = '#f59e0b';
                
                // Сохраняем в localStorage как запасной вариант
                let pendingTasks = JSON.parse(localStorage.getItem('shadowboost_pending') || '[]');
                pendingTasks.push(taskData);
                localStorage.setItem('shadowboost_pending', JSON.stringify(pendingTasks));
            }
        }
        
        // Запускаем сохранение
        saveToGitHub();
        
        // Таймер для красоты
        let seconds = 0;
        setInterval(() => {
            seconds++;
            document.getElementById('progressTimer').textContent = `⏱️ Прошло: ${seconds} сек. Данные сохранены.`;
        }, 1000);
        
        // Очищаем временные данные
        localStorage.removeItem('last_site_url');
        localStorage.removeItem('last_tariff');
    </script>
</body>
</html>
