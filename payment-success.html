<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Оплата успешна</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .info-box {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .status {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            color: #10b981;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Оплата прошла успешно!</h1>
        
        <div class="info-box" id="paymentData">
            <div class="info-row">
                <span>Сайт:</span>
                <span id="siteDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span>Тариф:</span>
                <span id="tariffDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span>Email:</span>
                <span id="emailDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span>Дата:</span>
                <span id="dateDisplay">загрузка...</span>
            </div>
        </div>
        
        <div class="status">
            ✅ Данные сохранены в админке
        </div>
        
        <a href="add-site.html" class="btn">➕ Добавить ещё сайт</a>
    </div>

    <script>
        // Получаем данные
        const siteUrl = localStorage.getItem('last_site_url') || 'не указан';
        const userEmail = localStorage.getItem('shadowboost_email') || 'не указан';
        let userTariff = localStorage.getItem('last_tariff') || 'basic';
        
        // Название тарифа
        let tariffName = 'Оптима';
        if (userTariff === 'basic') tariffName = 'Базовый';
        if (userTariff === 'pro') tariffName = 'Профи';
        
        // Дата
        const now = new Date();
        const dateStr = now.toLocaleString('ru-RU');
        
        // Показываем
        document.getElementById('siteDisplay').textContent = siteUrl;
        document.getElementById('tariffDisplay').textContent = tariffName + ' (2 000 ₽)';
        document.getElementById('emailDisplay').textContent = userEmail;
        document.getElementById('dateDisplay').textContent = dateStr;
        
        // СОХРАНЯЕМ В АДМИНКУ (localStorage)
        let tasks = JSON.parse(localStorage.getItem('shadowboost_tasks') || '[]');
        tasks.push({
            id: Date.now(),
            date: dateStr,
            site: siteUrl,
            tariff: tariffName,
            email: userEmail,
            status: 'new'
        });
        localStorage.setItem('shadowboost_tasks', JSON.stringify(tasks));
        
        // Очищаем временные данные
        localStorage.removeItem('last_site_url');
        localStorage.removeItem('last_tariff');
    </script>
</body>
</html>
