<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Оплата успешна</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Неоновые фоновые элементы */
        .neon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .neon-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
        }

        .circle-1 {
            width: 600px;
            height: 600px;
            background: #10B981;
            top: -200px;
            right: -200px;
        }

        .circle-2 {
            width: 500px;
            height: 500px;
            background: #6366F1;
            bottom: -200px;
            left: -200px;
        }

        .circle-3 {
            width: 400px;
            height: 400px;
            background: #8B5CF6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.1;
        }

        /* Основной контент */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(26, 24, 34, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: #10B981;
            border: 2px solid rgba(16, 185, 129, 0.2);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #10B981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #B0B0B0;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .site-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .site-label {
            color: #B0B0B0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .site-url {
            font-size: 18px;
            font-weight: 600;
            color: white;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 24px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .timer {
            font-size: 14px;
            color: #B0B0B0;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .info-text {
            margin-top: 24px;
            color: #B0B0B0;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Неоновые фоновые элементы -->
    <div class="neon-bg">
        <div class="neon-circle circle-1"></div>
        <div class="neon-circle circle-2"></div>
        <div class="neon-circle circle-3"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="success-icon">✓</div>
            
            <h1>Оплата прошла успешно!</h1>
            <p class="subtitle">Сайт добавлен в работу и проходит модерацию</p>
            
            <div class="site-info">
                <div class="site-label">Ваш сайт</div>
                <div class="site-url" id="siteUrl">loading...</div>
            </div>
            
            <div class="status-badge" id="statusBadge">
                ⏳ На модерации
            </div>
            
            <div class="timer" id="timer">
                Визиты начнутся через 30 минут
            </div>
            
            <a href="dashboard.html" class="btn" id="dashboardBtn">
                → Перейти в личный кабинет
            </a>
            
            <div class="info-text">
                После модерации визиты будут добавляться автоматически каждые 1-5 минут
            </div>
        </div>
    </div>

    <script>
        // Загрузка данных при открытии страницы
        document.addEventListener('DOMContentLoaded', function() {
            const siteUrl = localStorage.getItem('last_site_url') || 'ваш-сайт.ru';
            document.getElementById('siteUrl').textContent = siteUrl;
            
            // Обновляем статус сайта
            const sites = JSON.parse(localStorage.getItem('shadowboost_sites') || '[]');
            const lastSite = sites[sites.length - 1];
            
            if (lastSite) {
                lastSite.status = 'moderation';
                lastSite.activationTime = Date.now();
                localStorage.setItem('shadowboost_sites', JSON.stringify(sites));
            }
            
            // Запускаем таймер
            startTimer();
        });

        // Таймер до начала визитов
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const badgeElement = document.getElementById('statusBadge');
            
            const endTime = Date.now() + 30 * 60 * 1000; // 30 минут
            
            const interval = setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;
                
                if (diff <= 0) {
                    clearInterval(interval);
                    timerElement.textContent = 'Визиты начались!';
                    badgeElement.innerHTML = '✅ В работе';
                    badgeElement.style.color = '#10B981';
                    badgeElement.style.background = 'rgba(16, 185, 129, 0.1)';
                    badgeElement.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                    
                    // Обновляем статус сайта
                    const sites = JSON.parse(localStorage.getItem('shadowboost_sites') || '[]');
                    const lastSite = sites[sites.length - 1];
                    if (lastSite) {
                        lastSite.status = 'active';
                        localStorage.setItem('shadowboost_sites', JSON.stringify(sites));
                    }
                    
                    return;
                }
                
                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                
                timerElement.textContent = `Визиты начнутся через ${minutes} мин ${seconds} сек`;
            }, 1000);
        }
    </script>
</body>
</html>
