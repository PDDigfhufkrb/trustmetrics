<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Оплата успешна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(20px);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-label {
            color: #94a3b8;
        }
        
        .info-value {
            font-weight: 600;
            color: white;
        }
        
        .status {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            color: #10b981;
            font-weight: 500;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        
        .admin-link {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .admin-link a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .admin-link a:hover {
            text-decoration: underline;
        }
        
        .sheet-link {
            margin-top: 20px;
            padding: 20px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        
        <h1>Оплата прошла успешно!</h1>
        <p class="subtitle">Спасибо, что выбрали ShadowBoost</p>
        
        <div class="info-box">
            <div id="siteInfo" class="info-row">
                <span class="info-label">Сайт:</span>
                <span class="info-value" id="siteUrlDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Тариф:</span>
                <span class="info-value" id="tariffDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата запуска:</span>
                <span class="info-value" id="dateDisplay">сегодня</span>
            </div>
        </div>
        
        <div id="statusMessage" class="status">
            ⚙️ Передаём задачу в Google Таблицу...
        </div>
        
        <div class="sheet-link">
            📊 <strong>Google Таблица с заказами:</strong><br>
            <a href="https://docs.google.com/spreadsheets/d/1L0RgBp0SP9yXbWS9pR1OVc34h1Y4JXJ3YwT1iV1k2xM/edit?usp=sharing" target="_blank" style="color: #8b5cf6;">
                Открыть таблицу ShadowBoost Заказы
            </a>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="add-site.html" class="btn">➕ Добавить ещё сайт</a>
        </div>
    </div>

    <script>
        // ===========================================
        // SHADOWBOOST - ОТПРАВКА В GOOGLE ТАБЛИЦУ
        // ===========================================
        
        // ⚠️ ТВОЯ ССЫЛКА НА GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycaWOq-aWTTG1NvJ-_pamXvuicHozRBuVpI_j0Wa2J9ib7IiapL_T2-5n2kSr2p-Q/exec';
        
        // Получаем данные из URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id') || 'payment_' + Date.now();
        const tariff = urlParams.get('tariff') || 'basic';
        
        // Получаем данные из localStorage
        const siteUrl = localStorage.getItem('last_site_url') || 'не указан';
        const userEmail = localStorage.getItem('shadowboost_email') || 'не указан';
        
        // Отображаем информацию
        document.getElementById('siteUrlDisplay').textContent = siteUrl;
        
        let tariffName = 'Оптима (5 000 ₽)';
        if (tariff === 'basic') tariffName = 'Базовый (2 000 ₽)';
        if (tariff === 'pro') tariffName = 'Профи (10 000 ₽)';
        document.getElementById('tariffDisplay').textContent = tariffName;
        
        // ===========================================
        // ОТПРАВЛЯЕМ В GOOGLE ТАБЛИЦУ
        // ===========================================
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                site: siteUrl,
                tariff: tariff,
                email: userEmail,
                payment_id: paymentId
            })
        })
        .then(() => {
            // Успех (при no-cors мы не видим ответ)
            document.getElementById('statusMessage').innerHTML = '✅ Заタスク создана! Заказ появится в Google Таблице через 1-2 минуты.';
            document.getElementById('statusMessage').style.background = 'rgba(16, 185, 129, 0.1)';
            document.getElementById('statusMessage').style.borderColor = 'rgba(16, 185, 129, 0.3)';
            document.getElementById('statusMessage').style.color = '#10b981';
            
            // Сохраняем в историю
            let payments = JSON.parse(localStorage.getItem('shadowboost_payments') || '[]');
            payments.push({
                id: paymentId,
                site: siteUrl,
                tariff: tariff,
                date: new Date().toISOString(),
                status: 'active'
            });
            localStorage.setItem('shadowboost_payments', JSON.stringify(payments));
            
            console.log('✅ Задача отправлена в Google Таблицу');
        })
        .catch(error => {
            console.error('❌ Ошибка:', error);
            document.getElementById('statusMessage').innerHTML = '⚠️ Задача отправлена, но сервер вернул ошибку. Проверь таблицу через 1-2 минуты.';
            document.getElementById('statusMessage').style.background = 'rgba(245, 158, 11, 0.1)';
            document.getElementById('statusMessage').style.borderColor = 'rgba(245, 158, 11, 0.3)';
            document.getElementById('statusMessage').style.color = '#f59e0b';
        });
    </script>
</body>
</html>
