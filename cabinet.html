<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Добавить сайт</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Неоновые фоновые элементы */
        .neon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .neon-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            background: #6366F1;
            top: -200px;
            left: -200px;
            animation: float 20s ease-in-out infinite;
        }

        .circle-2 {
            width: 600px;
            height: 600px;
            background: #8B5CF6;
            bottom: -300px;
            right: -200px;
            animation: float 25s ease-in-out infinite reverse;
        }

        .circle-3 {
            width: 300px;
            height: 300px;
            background: #10B981;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.2; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Основной контент */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: rgba(26, 24, 34, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #FFFFFF;
        }

        .subtitle {
            color: #B0B0B0;
            font-size: 16px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #FFFFFF;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366F1;
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #EF4444;
            display: block;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10B981;
            display: block;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #B0B0B0;
            text-decoration: none;
            margin-top: 24px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #FFFFFF;
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .circle-1, .circle-2, .circle-3 {
                opacity: 0.1;
            }
        }
    </style>
</head>
<body>
    <!-- Неоновые фоновые элементы -->
    <div class="neon-bg">
        <div class="neon-circle circle-1"></div>
        <div class="neon-circle circle-2"></div>
        <div class="neon-circle circle-3"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">ShadowBoost</span>
            </div>
            
            <h1 class="title">Добавить сайт</h1>
            <p class="subtitle">Введите адрес сайта, чтобы начать продвижение</p>
            
            <div id="message" class="message"></div>
            
            <form id="addSiteForm">
                <div class="form-group">
                    <label for="siteUrl" class="form-label">
                        URL сайта
                    </label>
                    <input 
                        type="url" 
                        id="siteUrl" 
                        class="form-input" 
                        placeholder="https://ваш-сайт.ru"
                        required
                        autofocus
                    >
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <span>→</span>
                    Продолжить
                </button>
            </form>
            
            <a href="dashboard.html" class="back-link">
                ← Вернуться в кабинет
            </a>
        </div>
    </div>

    <script>
        // Получаем элементы
        const form = document.getElementById('addSiteForm');
        const siteUrlInput = document.getElementById('siteUrl');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Функция показа сообщения
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Валидация URL
        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        // Обработка отправки формы
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const siteUrl = siteUrlInput.value.trim();
            
            // Проверка на пустое поле
            if (!siteUrl) {
                showMessage('Введите URL сайта', 'error');
                siteUrlInput.focus();
                return;
            }
            
            // Проверка формата URL
            if (!isValidUrl(siteUrl)) {
                showMessage('Введите корректный URL (например: https://example.ru)', 'error');
                siteUrlInput.focus();
                return;
            }
            
            // Проверка авторизации
            const userEmail = localStorage.getItem('shadowboost_email');
            if (!userEmail) {
                window.location.href = 'register.html';
                return;
            }
            
            // Сохраняем сайт
            const siteData = {
                id: Date.now().toString(),
                url: siteUrl,
                date: new Date().toISOString(),
                status: 'draft', // draft - черновик, не запущен
                settings: {}
            };
            
            let sites = JSON.parse(localStorage.getItem('shadowboost_sites') || '[]');
            sites.push(siteData);
            localStorage.setItem('shadowboost_sites', JSON.stringify(sites));
            localStorage.setItem('current_site_id', siteData.id);
            localStorage.setItem('last_site_url', siteUrl);
            
            // Переходим в личный кабинет с этим сайтом
            window.location.href = `dashboard.html?site=${siteData.id}`;
        });

        // Автофокус на поле ввода
        siteUrlInput.focus();
    </script>
</body>
</html>
