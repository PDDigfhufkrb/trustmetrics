<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ХимАлк — главная страница интернет-магазина бытовой химии</title>
    <meta name="description" content="ХимАлк – крупный интернет-магазин бытовой химии и хозтоваров. Каталог товаров, низкие цены, доставка по России. Акции и новинки.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f6f9fc;
            color: #1e2f3e;
            overflow-x: hidden;
        }
        /* Прелоадер 2 секунды */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            text-align: center;
        }
        .loader .balls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .loader .balls div {
            width: 18px;
            height: 18px;
            background: #0078b6;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }
        .loader .balls div:nth-child(2) { animation-delay: 0.2s; background: #0096d9; }
        .loader .balls div:nth-child(3) { animation-delay: 0.4s; background: #005f8c; }
        @keyframes bounce {
            0% { transform: translateY(0); opacity: 0.6; }
            100% { transform: translateY(-20px); opacity: 1; }
        }
        .loader span {
            display: block;
            margin-top: 20px;
            font-weight: 500;
            color: #0078b6;
        }
        /* header */
        .header {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eef2f8;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #0b3550, #0078b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span {
            font-size: 12px;
            display: block;
            color: #5e7c99;
        }
        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 26px;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #e74c3c;
            color: white;
            border-radius: 30px;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* промо-баннер (прямоугольное изображение ряда бытовой химии) */
        .promo-banner {
            margin: 30px 0 20px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .promo-banner img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s;
        }
        .promo-banner:hover {
            transform: scale(1.01);
        }
        /* фильтры */
        .filters {
            margin: 40px 0 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .filter-btn {
            background: white;
            border: 1px solid #cddff0;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #0078b6;
            color: white;
            border-color: #0078b6;
        }
        /* сетка товаров */
        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin: 40px 0 20px;
            text-align: center;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 60px;
        }
        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.02);
            border: 1px solid #eef2f8;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
            border-color: #cde3f5;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ff1e2d;
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
        }
        .product-img {
            background: #fafcff;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .product-img img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            transition: transform 0.2s;
        }
        .product-card:hover .product-img img {
            transform: scale(1.02);
        }
        .product-info {
            padding: 18px 16px 20px;
        }
        .product-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 12px;
            height: 44px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price {
            font-size: 22px;
            font-weight: 800;
            color: #0078b6;
            margin-bottom: 16px;
        }
        .btn-add {
            width: 100%;
            background: #0078b6;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            transition: 0.2s;
            cursor: pointer;
        }
        .btn-add:hover {
            background: #005f8c;
        }
        /* корзина */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -420px;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -4px 0 25px rgba(0,0,0,0.1);
            z-index: 200;
            padding: 24px;
            transition: right 0.3s;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .cart-sidebar.open {
            right: 0;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
        }
        .cart-close {
            cursor: pointer;
            font-size: 28px;
        }
        .cart-items {
            flex: 1;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .cart-total {
            font-weight: 800;
            font-size: 20px;
            margin: 20px 0;
            text-align: right;
        }
        .btn-checkout {
            width: 100%;
            background: #27ae60;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }
        /* модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 480px;
            width: 90%;
            border-radius: 32px;
            padding: 32px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 28px;
            cursor: pointer;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 28px;
            border: 1px solid #cdddee;
            margin-bottom: 16px;
        }
        /* подвал */
        .footer {
            background: #0a1a29;
            color: #cbd5e6;
            padding: 40px 0;
            text-align: center;
            margin-top: 40px;
        }
        /* анимация появления */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 768px) {
            .cart-sidebar { width: 320px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .section-title { font-size: 28px; }
        }
    </style>
</head>
<body>

<!-- Прелоадер -->
<div class="preloader" id="preloader">
    <div class="loader">
        <div class="balls">
            <div></div><div></div><div></div>
        </div>
        <span>Загрузка каталога ХимАлк...</span>
    </div>
</div>

<!-- Шапка -->
<header class="header">
    <div class="container">
        <div class="header-inner">
            <div class="logo">
                <h1>ХимАлк<span>®</span></h1>
                <span>бытовая химия оптом и в розницу</span>
            </div>
            <div class="cart-icon" id="openCartBtn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <!-- Прямоугольный баннер (ряд бытовой химии) -->
    <div class="promo-banner fade-up">
        <a href="#catalog">
            <img src="https://s10.iimage.su/s/05/gHiqarlx2zCzL7YZJ730QbVJ25HzoRQizXvdOzt2W.png" alt="Бытовая химия в ассортименте">
        </a>
    </div>

    <!-- Фильтры -->
    <div class="filters fade-up" id="filtersBlock">
        <button class="filter-btn active" data-cat="all">Все товары</button>
        <button class="filter-btn" data-cat="stirka">Стирка</button>
        <button class="filter-btn" data-cat="posuda">Средства для посуды</button>
        <button class="filter-btn" data-cat="uborka">Уборка и чистящие</button>
        <button class="filter-btn" data-cat="konditsioner">Кондиционеры для белья</button>
    </div>

    <!-- Сетка товаров (каталог) -->
    <div class="section-title fade-up" id="catalog">🔥 Популярные товары</div>
    <div class="products-grid fade-up" id="productsGrid"></div>
</main>

<!-- Корзина -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <span>Корзина</span>
        <span class="cart-close" id="closeCartBtn">&times;</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total" id="cartTotal"></div>
    <button class="btn-checkout" id="checkoutBtn">Оформить заказ</button>
</div>

<!-- Модальное окно заказа -->
<div class="modal" id="orderModal">
    <div class="modal-content">
        <span class="close-modal" id="modalClose">&times;</span>
        <h2 style="margin-bottom: 20px;">Оформление заказа</h2>
        <form id="orderForm">
            <input type="text" placeholder="Ваше имя" required>
            <input type="tel" placeholder="Телефон" required>
            <input type="email" placeholder="Email">
            <textarea rows="3" placeholder="Адрес доставки"></textarea>
            <button type="submit" style="width:100%; background:#27ae60; border:none; padding:14px; border-radius:40px; color:white; font-weight:bold;">Подтвердить заказ</button>
        </form>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <p>© 2025 ХимАлк – интернет-магазин бытовой химии. Цены указаны ориентировочные.</p>
    </div>
</footer>

<script>
    // Товары (взяты из кода FixPrice, изображения оригинальные)
    const products = [
        { id: 3010087, name: "Чистящее средство \"Универсал\", Чистин, 750 г", price: 83, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/22/225b0d86e2b1c50b8b1fd87b1d10e1e5.png", category: "uborka", badge: false },
        { id: 3013034, name: "Средство для чистки труб, Sanfor, 1000 г", price: 116, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/oblozka_sanfor.png", category: "uborka", badge: false },
        { id: 3000683, name: "Капсулы для стирки, SI:LA Bleska, 21 шт.", price: 229, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/b2/b2c71e4d8a5e455d79d3628e828f71ca.jpg", category: "stirka", badge: { text: "спец цена", color: "#ff1e2d" } },
        { id: 3000599, name: "Гель для стирки, BIAL, 1500 мл", price: 149, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/824b75bf87640205042f60cc9e0f5a12.jpg", category: "stirka", badge: false },
        { id: 3001205, name: "Кондиционер для белья, VESTAR, 1 л", price: 87, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/a0b59657edf586d11d9e6e681d01b229.jpg", category: "konditsioner", badge: false },
        { id: 3030001, name: "Набор клеев, Master Hand, универсальный и супер-клей", price: 116, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/29/29b29c3bb9ff6fbe7986825fa9ea9427.jpg", category: "uborka", badge: false },
        { id: 3000623, name: "Экологичный стиральный порошок \"IRMA Automat\", 2,4 кг", price: 174.5, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/9f/9f55957923fa9a5efa3d098f0c383316.jpg", category: "stirka", badge: false },
        { id: 3001225, name: "Кондиционер парфюмированный, For best you, 750 мл", price: 116, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/cd/cd04417207de7beab6124c5688f7e0ba.jpg", category: "konditsioner", badge: false },
        { id: 3011101, name: "Чистящее средство антижир \"Azelit\" для стеклокерамики, GRASS, 600 мл", price: 199, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/07/0745036dd2d2604e0dee2c85af3dd02e.jpg", category: "uborka", badge: { text: "спец цена", color: "#ff1e2d" } },
        { id: 3000307, name: "Стиральный порошок, BiMax, 2,4 кг", price: 399, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/746631c45285cccd45884d122f8312fe.jpg", category: "stirka", badge: { text: "спец цена", color: "#ff1e2d" } },
        { id: 3000570, name: "Гель для стирки \"Универсальный\", Вестар, 2,5 л", price: 229, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/62d2afaae3a16732772e361ba00fc3e2.jpg", category: "stirka", badge: false },
        { id: 3000622, name: "Гель для стирки, VESTAR, 1500 мл", price: 133, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/01/01818c6cd1f646881b769deb989f1065.jpg", category: "stirka", badge: false },
        { id: 3005142, name: "Средство для мытья посуды, Sorti, 450 г", price: 89, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/bit/_marketplace/images/origin/8d/8de2fc1b69ae894e1406f90432371a3f.jpg", category: "posuda", badge: { text: "спец цена", color: "#ff1e2d" } },
        { id: 3005294, name: "Гель для мытья посуды, IRMA, 450 г", price: 105, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/84dbf35845347e5293b59ad3d617843b.jpg", category: "posuda", badge: false },
        { id: 3020048, name: "Освежитель воздуха, Gold Wind, 400 мл", price: 119, image: "https://img.fix-price.com/insecure/rs:fit:300:300/plain/pim/images/_default_upload_bucket/94001b65b1a26dd2300adc992cf93f01.jpg", category: "uborka", badge: { text: "спец цена", color: "#ff1e2d" } }
    ];

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderProducts(filterCat = "all") {
        const grid = document.getElementById('productsGrid');
        const filtered = filterCat === "all" ? products : products.filter(p => p.category === filterCat);
        if (filtered.length === 0) { grid.innerHTML = '<div style="text-align:center; padding: 50px;">Товаров не найдено</div>'; return; }
        grid.innerHTML = filtered.map(p => `
            <div class="product-card">
                ${p.badge ? `<div class="badge" style="background:${p.badge.color}">${p.badge.text}</div>` : ''}
                <div class="product-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price.toFixed(2)} ₽</div>
                    <button class="btn-add" data-id="${p.id}">В корзину</button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.btn-add').forEach(btn => {
            btn.addEventListener('click', () => addToCart(parseInt(btn.dataset.id)));
        });
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;
        const existing = cart.find(item => item.id === id);
        if (existing) existing.quantity += 1;
        else cart.push({ ...product, quantity: 1 });
        saveCart();
        updateCartUI();
        document.getElementById('cartSidebar').classList.add('open');
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        saveCart();
        updateCartUI();
    }

    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        const countSpan = document.getElementById('cartCount');
        const totalSpan = document.getElementById('cartTotal');
        let total = 0, count = 0;
        if (cart.length === 0) {
            container.innerHTML = '<p style="text-align:center;">Корзина пуста</p>';
            countSpan.innerText = '0';
            totalSpan.innerText = 'Итого: 0 ₽';
            return;
        }
        container.innerHTML = cart.map(item => {
            total += item.price * item.quantity;
            count += item.quantity;
            return `
                <div class="cart-item">
                    <div><strong>${item.name}</strong><br>${item.price} ₽ x ${item.quantity}</div>
                    <div><button class="remove-item" data-id="${item.id}" style="background:none; border:none; color:#e74c3c; cursor:pointer;">🗑</button></div>
                </div>
            `;
        }).join('');
        countSpan.innerText = count;
        totalSpan.innerText = `Итого: ${total.toFixed(2)} ₽`;
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', () => removeFromCart(parseInt(btn.dataset.id)));
        });
    }

    // Фильтры
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(btn.dataset.cat);
        });
    });

    // Корзина sidebar
    const cartSidebar = document.getElementById('cartSidebar');
    document.getElementById('openCartBtn').addEventListener('click', () => { cartSidebar.classList.add('open'); updateCartUI(); });
    document.getElementById('closeCartBtn').addEventListener('click', () => cartSidebar.classList.remove('open'));

    // Оформление заказа
    const checkoutBtn = document.getElementById('checkoutBtn');
    const modal = document.getElementById('orderModal');
    const modalClose = document.getElementById('modalClose');
    checkoutBtn.addEventListener('click', () => {
        if (cart.length === 0) { alert("Корзина пуста"); return; }
        modal.style.display = 'flex';
    });
    modalClose.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    document.getElementById('orderForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('✅ Спасибо за заказ! Наш менеджер свяжется с вами.');
        cart = [];
        saveCart();
        updateCartUI();
        modal.style.display = 'none';
        cartSidebar.classList.remove('open');
        e.target.reset();
    });

    // Анимация появления при скролле
    const fadeElements = document.querySelectorAll('.fade-up');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
        });
    }, { threshold: 0.1 });
    fadeElements.forEach(el => observer.observe(el));

    // Прелоадер
    window.addEventListener('load', () => {
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if (preloader) preloader.classList.add('fade-out');
        }, 2000);
    });

    // Начальный рендер
    renderProducts('all');
    updateCartUI();
</script>
</body>
</html>
