<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Оплата успешна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(20px);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-label {
            color: #94a3b8;
        }
        
        .info-value {
            font-weight: 600;
            color: white;
        }
        
        .status {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            color: #10b981;
            font-weight: 500;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        
        .timer {
            color: #f59e0b;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        
        <h1>Оплата прошла успешно!</h1>
        <p class="subtitle">Спасибо, что выбрали ShadowBoost</p>
        
        <div class="info-box">
            <div id="siteInfo" class="info-row">
                <span class="info-label">Сайт:</span>
                <span class="info-value" id="siteUrlDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Тариф:</span>
                <span class="info-value" id="tariffDisplay">загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата запуска:</span>
                <span class="info-value" id="dateDisplay">сегодня</span>
            </div>
        </div>
        
        <div id="statusMessage" class="status">
            ⚙️ Передаём задачу в систему...
        </div>
        
        <a href="dashboard.html" class="btn">Перейти в кабинет</a>
        <div class="timer" id="progressTimer"></div>
    </div>

    <script>
        // ===========================================
        // МАКСИМАЛЬНО ТУПОЙ СКРИПТ
        // Просто отправляет данные в add_task.php
        // ===========================================
        
        // Получаем данные из URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id') || 'неизвестно';
        
        // Получаем данные из localStorage
        const siteUrl = localStorage.getItem('last_site_url') || 'не указан';
        const userEmail = localStorage.getItem('shadowboost_email') || 'не указан';
        
        // Определяем тариф по URL страницы
        let tariff = 'optimal'; // по умолчанию
        if (window.location.href.includes('basic')) tariff = 'basic';
        if (window.location.href.includes('pro')) tariff = 'pro';
        
        // Отображаем информацию
        document.getElementById('siteUrlDisplay').textContent = siteUrl;
        
        let tariffName = 'Оптима (5 000 ₽)';
        if (tariff === 'basic') tariffName = 'Базовый (2 000 ₽)';
        if (tariff === 'pro') tariffName = 'Профи (10 000 ₽)';
        document.getElementById('tariffDisplay').textContent = tariffName;
        
        // ===========================================
        // ГЛАВНОЕ: ОТПРАВЛЯЕМ ЗАДАЧУ В add_task.php
        // ===========================================
        fetch('add_task.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `site=${encodeURIComponent(siteUrl)}&tariff=${encodeURIComponent(tariff)}&email=${encodeURIComponent(userEmail)}`
        })
        .then(response => response.text())
        .then(result => {
            console.log('✅ Ответ от сервера:', result);
            
            if (result === 'OK') {
                // Всё отлично
                document.getElementById('statusMessage').innerHTML = '✅ Задача создана! Запуск в течение 5-10 минут.';
                document.getElementById('statusMessage').style.background = 'rgba(16, 185, 129, 0.1)';
                document.getElementById('statusMessage').style.borderColor = 'rgba(16, 185, 129, 0.3)';
                document.getElementById('statusMessage').style.color = '#10b981';
                
                // Сохраняем в историю
                let payments = JSON.parse(localStorage.getItem('shadowboost_payments') || '[]');
                payments.push({
                    id: paymentId,
                    site: siteUrl,
                    tariff: tariff,
                    date: new Date().toISOString(),
                    status: 'active'
                });
                localStorage.setItem('shadowboost_payments', JSON.stringify(payments));
                
            } else {
                // Ошибка
                document.getElementById('statusMessage').innerHTML = '⚠️ Задача создана, но сервер вернул странный ответ. Мы уже чиним.';
                document.getElementById('statusMessage').style.background = 'rgba(245, 158, 11, 0.1)';
                document.getElementById('statusMessage').style.borderColor = 'rgba(245, 158, 11, 0.3)';
                document.getElementById('statusMessage').style.color = '#f59e0b';
            }
        })
        .catch(error => {
            console.error('❌ Ошибка:', error);
            
            // Даже если ошибка - всё равно задача могла создаться
            document.getElementById('statusMessage').innerHTML = '⚠️ Задача отправлена. Проверьте статус в личном кабинете.';
            document.getElementById('statusMessage').style.background = 'rgba(245, 158, 11, 0.1)';
            document.getElementById('statusMessage').style.borderColor = 'rgba(245, 158, 11, 0.3)';
            document.getElementById('statusMessage').style.color = '#f59e0b';
        });
        
        // Таймер для красоты
        let seconds = 0;
        setInterval(() => {
            seconds++;
            document.getElementById('progressTimer').textContent = `⏱️ Прошло: ${seconds} сек. Задача в очереди...`;
        }, 1000);
    </script>
</body>
</html>
