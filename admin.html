<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Админка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            padding: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
            background: rgba(30, 30, 46, 0.7);
            border-radius: 24px;
            padding: 20px;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .empty {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }
        
        .refresh {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 ShadowBoost — Задачи</h1>
        <button class="refresh" onclick="loadTasks()">🔄 Обновить</button>
        
        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Сайт</th>
                    <th>Тариф</th>
                    <th>Email</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tasksList">
                <tr>
                    <td colspan="5" class="empty">Загрузка...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('shadowboost_tasks') || '[]');
            const tbody = document.getElementById('tasksList');
            
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">✨ Пока нет задач</td></tr>';
                return;
            }
            
            // Сортируем от новых к старым
            tasks.sort((a, b) => b.id - a.id);
            
            let html = '';
            tasks.forEach(task => {
                html += `
                    <tr>
                        <td>${task.date}</td>
                        <td><a href="${task.site}" target="_blank">${task.site}</a></td>
                        <td>${task.tariff}</td>
                        <td>${task.email}</td>
                        <td>
                            <button class="btn" onclick="copySite('${task.site}')">📋 Копировать</button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }
        
        function copySite(site) {
            navigator.clipboard.writeText(site);
            alert('Сайт скопирован: ' + site);
        }
        
        // Загружаем сразу
        loadTasks();
    </script>
</body>
</html>
