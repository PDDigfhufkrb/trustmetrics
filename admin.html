<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBoost — Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
            padding: 30px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        h1 {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
        }
        
        .login-box {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            margin: 100px auto;
            backdrop-filter: blur(20px);
        }
        
        .login-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .login-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 30px;
            backdrop-filter: blur(20px);
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #6366f1;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .tasks-card {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px 10px;
            color: #94a3b8;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-new {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }
        
        .badge-done {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        
        .btn-copy {
            background: #6366f1;
            color: white;
        }
        
        .btn-done {
            background: #10b981;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .refresh-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .login-error {
            color: #ef4444;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="container" style="max-width: 400px;">
        <div class="login-box">
            <div class="login-title">🔐 Вход в админ-панель</div>
            <input type="text" id="loginUser" class="login-input" placeholder="Логин" value="admin">
            <input type="password" id="loginPass" class="login-input" placeholder="Пароль" value="shadow123">
            <button class="login-btn" onclick="login()">Войти</button>
            <div id="loginError" class="login-error">Неверный логин или пароль</div>
        </div>
    </div>

    <div id="adminPage" class="container" style="display: none;">
        <div class="header">
            <h1>📋 ShadowBoost — Задачи</h1>
            <div style="display: flex; gap: 10px;">
                <span style="color: #94a3b8;" id="userDisplay">admin</span>
                <button onclick="logout()" style="background: none; border: none; color: #ef4444; cursor: pointer;">Выход</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="statNew">0</div>
                <div class="stat-label">Новых задач</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Всего задач</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statToday">0</div>
                <div class="stat-label">За сегодня</div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadTasks()">🔄 Обновить</button>
        
        <div class="tasks-card">
            <div id="tasksContainer">
                <div class="empty-state">Загрузка задач...</div>
            </div>
        </div>
        
        <div style="margin-top: 30px; color: #94a3b8; font-size: 13px; text-align: center;">
            <p>📁 Данные хранятся в файле tasks.json в репозитории</p>
            <p><a href="https://github.com/PDDigfhufkrb/trustmetrics/blob/main/tasks.json" target="_blank" style="color: #6366f1;">Открыть на GitHub →</a></p>
        </div>
    </div>

    <script>
        // ===========================================
        // ShadowBoost - АДМИНКА НА GITHUB
        // ===========================================
        
        // НАСТРОЙКИ - ТВОИ ДАННЫЕ
        const GITHUB_USER = 'PDDigfhufkrb';
        const GITHUB_REPO = 'trustmetrics';
        
        // Простая авторизация
        const VALID_USER = 'admin';
        const VALID_PASS = 'shadow123';
        
        function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            if (user === VALID_USER && pass === VALID_PASS) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPage').style.display = 'block';
                document.getElementById('userDisplay').textContent = user;
                loadTasks();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
        
        function logout() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('adminPage').style.display = 'none';
        }
        
        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/tasks.json`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    container.innerHTML = '<div class="empty-state">📭 Файл tasks.json пока пуст</div>';
                    return;
                }
                
                const data = await response.json();
                const content = atob(data.content);
                const tasks = JSON.parse(content);
                
                // Обновляем статистику
                const today = new Date().toDateString();
                const todayTasks = tasks.filter(t => new Date(t.date).toDateString() === today);
                
                document.getElementById('statTotal').textContent = tasks.length;
                document.getElementById('statNew').textContent = tasks.filter(t => t.status === 'new').length;
                document.getElementById('statToday').textContent = todayTasks.length;
                
                // Отображаем таблицу
                if (tasks.length === 0) {
                    container.innerHTML = '<div class="empty-state">✨ Задач пока нет</div>';
                    return;
                }
                
                // Сортируем: новые сверху
                tasks.sort((a, b) => b.timestamp - a.timestamp);
                
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Дата</th>
                                <th>Сайт</th>
                                <th>Тариф</th>
                                <th>Email</th>
                                <th>Статус</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                tasks.forEach((task, index) => {
                    html += `
                        <tr>
                            <td style="color: #6366f1;">#${index + 1}</td>
                            <td>${task.date || '—'}</td>
                            <td><a href="${task.site}" target="_blank" style="color: #94a3b8;">${task.site}</a></td>
                            <td>${task.tariff_name || task.tariff}</td>
                            <td>${task.email}</td>
                            <td><span class="badge badge-${task.status === 'new' ? 'new' : 'done'}">${task.status}</span></td>
                            <td>
                                <button class="btn btn-copy" onclick="copyToClipboard('${task.site}')">📋 Копировать</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = '<div class="empty-state">❌ Ошибка загрузки данных</div>';
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Сайт скопирован: ' + text);
            });
        }
        
        // Проверяем, может уже залогинены
        if (localStorage.getItem('shadowboost_admin')) {
            login();
        }
    </script>
</body>
</html>
